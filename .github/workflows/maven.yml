# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
        os: [ubuntu-latest, windows-latest]
        jdk: [21]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'
        cache: maven
        server-id: apache.snapshots.https
        server-username: NEXUS_USERNAME
        server-password: NEXUS_PASSWORD

    # No explicit Maven setup: the GitHub-hosted runner images ship Maven
    # 3.9.16, which is newer than the version we used to install here.

    - name: Set up cache date
      run: echo "CACHE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Build with Maven
      # --settings: see .github/maven-settings.xml (temporary, for the 19-SNAPSHOT parent)
      run: mvn --show-version --batch-mode --no-transfer-progress --settings .github/maven-settings.xml clean verify

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/target/surefire-reports/TEST-*.xml'

    - name: Upload to Nexus
      if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
      env:
        # `NEXUS_USERNAME` and `NEXUS_PASSWORD` are used in `~/.m2/settings.xml` created by `setup-java` action
        NEXUS_USERNAME: ${{ secrets.NEXUS_USER }}
        NEXUS_PASSWORD: ${{ secrets.NEXUS_PW }}
      run: mvn --show-version --batch-mode --errors --no-transfer-progress --settings .github/maven-settings.xml -DskipTests deploy
